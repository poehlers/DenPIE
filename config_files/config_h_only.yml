# Falcon configuration — single-parameter model (h only)
#
# Only h is sampled. Ω_m, Ω_b, n_s, σ_8 are fixed at Planck 2018/Quijote fiducial.
#
# Run with:
#   falcon sample prior --config-name config_files/config_h_only.yml --run-dir outputs/h_only_run

paths:
  import: "."
  graph:  "${run_dir}/graph"

logging: {}

sample:
  prior:
    n: 100

# ─────────────────────────────────────────────────────────────────────────────
graph:

  # ── Node 1: Cosmological parameters ────────────────────────────────────────
  cosmo_params:
    simulator:
      _target_: falcon.priors.Hypercube
      priors:
        - ['uniform', 0.50, 0.90]   # h
    estimator:
      _target_: falcon.estimators.Flow
      loop:
        num_epochs: 300
        batch_size: 8
        early_stop_patience: 32
      network:
        net_type: nsf
        theta_norm: true
        norm_momentum: 0.01
      embedding:
        _target_: falcon.embeddings.LazyOnlineNorm
        _input_: [delta_fin]
      optimizer:
        lr: 0.001
        lr_decay_factor: 0.5
        scheduler_patience: 16
      inference:
        gamma: 0.5
        discard_samples: true
        log_ratio_threshold: -20
    ray:
      num_gpus: 0

  # ── Node 2: Linear matter power spectrum P(k) ──────────────────────────────
  pk:
    parents: [cosmo_params]
    simulator:
      _target_: den_pie.forward.PowerSpectrum
      dim:     3
      res:     128
      boxsize: 1000.0
      fixed_cosmo_params:
        Omega_m: 0.3175
        Omega_b: 0.0490
        n_s:     0.9624
        sigma8:  0.8340
    ray:
      num_gpus: 0

  # ── Node 3: Gaussian-random initial conditions ──────────────────────────────
  delta_ic:
    parents: [pk]
    simulator:
      _target_: den_pie.forward.InitialConditions
      dim:     3
      res:     128
      boxsize: 1000.0
      run_dir: ${run_dir}
    ray:
      num_gpus: 0

  # ── Node 4: N-body forward simulation (PM, bullfrog stepper, z=3 → z=0) ───
  delta_fin:
    parents: [cosmo_params, delta_ic]
    simulator:
      _target_: den_pie.forward.ForwardModel
      dim:            3
      res:            128
      boxsize:        1000.0
      sub_batch_size: 1
      fixed_cosmo_params:
        Omega_m: 0.3175
        Omega_b: 0.0490
        n_s:     0.9624
        sigma8:  0.8340
      sim_params:
        a_ini:                0.25
        a_end:                1.00
        stepper:              bullfrog
        method:               pm
        res_pm:               256
        time_var:             D
        alpha:                1.5
        theta:                0.5
        antialias:            0
        grad_kernel_order:    4
        laplace_kernel_order: 0
        n_resample:           1
        n_steps:              1
        deconvolve:           false
        nlpt_order_ics:       2
        worder:               2
    ray:
      num_gpus: 1.0
