# Falcon configuration — 5-parameter model with WIDE priors (user-editable)
#
# All 5 cosmological parameters are sampled. Edit the prior bounds below.
# Look for "← EDIT" comments to find the lines to change.
#
# Run with:
#   falcon sample prior --config-name config_files/config_5param_wide.yml --run-dir outputs/5param_wide_run

paths:
  import: "."
  graph:  "${run_dir}/graph"

logging: {}

sample:
  prior:
    n: 1000

# ─────────────────────────────────────────────────────────────────────────────
graph:

  # ── Node 1: Cosmological parameters ────────────────────────────────────────
  cosmo_params:
    simulator:
      _target_: falcon.priors.Hypercube
      priors:
        # - ['uniform', 0.05, 0.70]   # Ω_m  ← EDIT lo/hi bounds for wider prior
        # - ['uniform', 0.01, 0.10]   # Ω_b  ← EDIT lo/hi bounds for wider prior
        # - ['uniform', 0.40, 1.0]   # h    ← EDIT lo/hi bounds for wider prior
        # - ['uniform', 0.70, 1.30]   # n_s  ← EDIT lo/hi bounds for wider prior
        # - ['uniform', 0.40, 1.20]   # σ_8  ← EDIT lo/hi bounds for wider prior
        - ['uniform', 0.05, 1.]   # Ω_m  ← EDIT lo/hi bounds for wider prior
        - ['uniform', 0.01, 0.5]   # Ω_b  ← EDIT lo/hi bounds for wider prior
        - ['uniform', 0.05, 2.0]   # h    ← EDIT lo/hi bounds for wider prior
        - ['uniform', 0.25, 2.00]   # n_s  ← EDIT lo/hi bounds for wider prior
        - ['uniform', 0.05, 2.00]   # σ_8  ← EDIT lo/hi bounds for wider prior
    estimator:
      _target_: falcon.estimators.Flow
      loop:
        num_epochs: 300
        batch_size: 8
        early_stop_patience: 32
      network:
        net_type: nsf
        theta_norm: true
        norm_momentum: 0.01
      embedding:
        _target_: falcon.embeddings.LazyOnlineNorm
        _input_: [delta_fin]
      optimizer:
        lr: 0.001
        lr_decay_factor: 0.5
        scheduler_patience: 16
      inference:
        gamma: 0.5
        discard_samples: true
        log_ratio_threshold: -20
    ray:
      num_gpus: 0

  # ── Node 2: Linear matter power spectrum P(k) ──────────────────────────────
  pk:
    parents: [cosmo_params]
    simulator:
      _target_: den_pie.forward.PowerSpectrum
      dim:     3
      res:     64
      boxsize: 1000.0
    ray:
      num_gpus: 0

  # ── Node 3: Gaussian-random initial conditions ──────────────────────────────
  delta_ic:
    parents: [pk]
    simulator:
      _target_: den_pie.forward.InitialConditions
      dim:     3
      res:     64
      boxsize: 1000.0
      run_dir: ${run_dir}
    ray:
      num_gpus: 0

  # ── Node 4: N-body forward simulation (PM, bullfrog stepper, z=3 → z=0) ───
  delta_fin:
    parents: [cosmo_params, delta_ic]
    simulator:
      _target_: den_pie.forward.ForwardModel
      dim:            3
      res:            64
      boxsize:        1000.0
      sub_batch_size: 1
      sim_params:
        a_ini:                0.25
        a_end:                1.00
        stepper:              bullfrog
        method:               pm
        res_pm:               128
        time_var:             D
        alpha:                1.5
        theta:                0.5
        antialias:            0
        grad_kernel_order:    4
        laplace_kernel_order: 0
        n_resample:           1
        n_steps:              1
        deconvolve:           false
        nlpt_order_ics:       2
        worder:               2
    ray:
      num_gpus: 1.0
