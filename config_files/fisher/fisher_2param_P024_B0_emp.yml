# Fisher (Omega_m, sigma_8) on fli_2param, final field (RSD + shot noise).
# Data vector: [P_0, P_2, P_4, B_0].  Covariance: full empirical (euclid_cov).
#   n_data = 3 x n_P_bins + n_triangles is large, so n_cov_seeds must be big to
#   satisfy Hartlap (n_cov_seeds > n_data + 4). Raise it / coarsen pb_step if the
#   run warns about a small/non-positive Hartlap factor.
res:          128
boxsize:      1000.0
n_g_density:  1.0e-3
pb_step:      3
n_seeds:      10
n_cov_seeds:  2400
field: "fin"
pk_multipoles: True
joint_pb: True
cov_type: euclid_cov
jacrev_chunk_size: 32

# Forward-mode AD + x64: growth-complete Omega_m at autodiff precision.
derivative_method: jacfwd
