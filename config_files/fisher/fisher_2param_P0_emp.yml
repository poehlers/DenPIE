# Fisher (Omega_m, sigma_8) on fli_2param, final field (RSD + shot noise).
# Data vector: [P_0] only.  Covariance: full empirical (euclid_cov), Hartlap-corr.
#   n_cov_seeds must exceed n_data + 4; P_0-only is small so 600 is plenty.
res:          128
boxsize:      1000.0
n_g_density:  1.0e-3
pb_step:      3
n_seeds:      10
n_cov_seeds:  600
field: "fin"
pk_multipoles: False
joint_pb: False
cov_type: euclid_cov
jacrev_chunk_size: 32

# Forward-mode AD + x64: growth-complete Omega_m at autodiff precision.
derivative_method: jacfwd
