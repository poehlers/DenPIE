name: optuna_best_cnn3d_maf_stage2_flow
density:
  encoder:
    type: cnn3d
    summary_dim: 256
    use_checkpointing: true
    proj_dropout: 0.0
    load: true
    model_location: output/optuna_best_cnn3d_maf_stage1_encoder_latest/models/encoder/best.pth
  flow:
    type: maf
    use_sbi: true
    dropout: 0.2960660809801552
    num_transforms: 6
    hidden_features: 128
    load: false
    model_location: ''
  data:
    data_path: /projects/prjs1926/data/fli_data/fli_bias_LR/samples_dir/prior/
    fiducial_path: /projects/prjs1926/data/fli_data/fli_fiducial_bias_LR/samples_dir/prior/
    field_key: delta_biased
    param_keys:
    - cosmo_params
    - bias_params
    all_param_names:
    - Omega_m
    - sigma_8
    - b1
    - b2
    - bs2
    - bn2
    active_params:
    - Omega_m
    - sigma_8
    - b1
    - b2
    - bs2
    - bn2
    val_split: 0.1
    test_split: 0.1
    n_realizations: null
    log_transform: true
  train:
    train_network: flow
    epochs: 500
    batch_size: 32
    lr: 6.963114377829292e-06
    optimizer: AdamW
    weight_decay: 0.00016736010167825804
    scheduler: ReduceLROnPlateau
    scheduler_params:
      factor: 0.3
      patience: 10
      min_lr: 1.0e-07
    gradient_accumulation_steps: 2
    grad_clip: 397.51014618349586
    patience: 25
