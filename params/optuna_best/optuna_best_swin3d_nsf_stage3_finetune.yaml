name: optuna_best_swin3d_nsf_stage3_finetune
density:
  encoder:
    type: swin3d
    summary_dim: 256
    use_checkpointing: true
    proj_dropout: 0.09127267288786131
    load: true
    model_location: <SET_PATH_TO_STAGE1_ENCODER_BEST>
  flow:
    type: nsf
    use_sbi: true
    dropout: 0.05454749016213018
    load: true
    model_location: <SET_PATH_TO_STAGE2_FLOW_BEST>
    num_transforms: 10
    hidden_features: 256
    num_bins: 5
  data:
    data_path: /projects/prjs1926/data/fli_data/fli_bias_LR/samples_dir/prior/
    fiducial_path: /projects/prjs1926/data/fli_data/fli_fiducial_bias_LR/samples_dir/prior/
    field_key: delta_biased
    param_keys:
    - cosmo_params
    - bias_params
    all_param_names:
    - Omega_m
    - sigma_8
    - b1
    - b2
    - bs2
    - bn2
    active_params:
    - Omega_m
    - sigma_8
    - b1
    - b2
    - bs2
    - bn2
    val_split: 0.1
    test_split: 0.1
    n_realizations: null
    log_transform: true
  train:
    train_network: both
    epochs: 500
    batch_size: 16
    lr: 1.3311216080736901e-05
    optimizer: AdamW
    weight_decay: 0.0004335281794951569
    scheduler: ReduceLROnPlateau
    scheduler_params:
      factor: 0.3
      patience: 10
      min_lr: 1.0e-07
    gradient_accumulation_steps: 2
    grad_clip: 132.53202943404523
    patience: 25
