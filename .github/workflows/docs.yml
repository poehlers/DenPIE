name: docs

# Build the Sphinx site and publish it to GitHub Pages.
# Enable once under: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The site then serves at https://poehlers.github.io/DenPIE/.
#
# The heavy scientific stack (torch/jax/discodj/BFast/Pylians/classy/sbi/...) is
# NOT installed here; conf.py mocks whatever is not importable, so only the light
# docs toolchain is needed and the build stays fast.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install sphinx furo myst-parser sphinx-copybutton numpy scipy matplotlib jaxtyping
      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
